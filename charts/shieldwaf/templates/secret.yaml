{{- if .Values.secret.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secret.name }}
{{- $data := dict }}{{- if $existing }}{{- $data = $existing.data | default dict }}{{- end }}
{{- $pw := randAlphaNum 32 }}
{{- $url := "" }}
{{- if .Values.database.bundled }}
{{- $url = printf "postgresql://shieldwaf:%s@shieldwaf-db:5432/shieldwaf" $pw }}
{{- else }}
{{- $url = required "database.bundled=false needs secret.externalDbUrl (or create the secret yourself and set secret.create=false)" .Values.secret.externalDbUrl }}
{{- end }}
{{- $key := randAlphaNum 32 | b64enc | replace "+" "-" | replace "/" "_" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.name }}
  labels: {{- include "shieldwaf.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep       # survives `helm uninstall`: the data key is needed to read old backups
type: Opaque
data:
  POSTGRES_PASSWORD: {{ get $data "POSTGRES_PASSWORD" | default ($pw | b64enc) }}
  SHIELD_DB_URL: {{ get $data "SHIELD_DB_URL" | default ($url | b64enc) }}
  SHIELD_DATA_KEY: {{ get $data "SHIELD_DATA_KEY" | default ($key | b64enc) }}
{{- end }}
