apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.deployment.name }}
  labels: {{- include "shieldwaf.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    type: RollingUpdate            # a new replica is ready before an old one stops: no downtime on upgrades
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: shieldwaf
  template:
    metadata:
      labels:
        app: shieldwaf
        {{- include "shieldwaf.labels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations: {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: shieldwaf-app         # its own account with no permissions and no token
      automountServiceAccountToken: false      # the WAF never talks to the Kubernetes API
      terminationGracePeriodSeconds: 45
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{- toYaml . | nindent 10 }}
          labelSelector:
            matchLabels:
              app: shieldwaf
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10101
        runAsGroup: 10101
        fsGroup: 10101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: engine
          image: {{ include "shieldwaf.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/engine-entrypoint.sh"]
          lifecycle:
            preStop:                           # keep serving for a moment after the pod leaves the Service (no dropped requests)
              exec:
                command: ["sleep", "8"]
          ports:
            - containerPort: 8080
            - containerPort: 8443
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /__shieldwaf_health
              port: 8080
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /__shieldwaf_health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 20
          resources: {{- toYaml .Values.resources.engine | nindent 12 }}
          volumeMounts:
            - name: data                       # the engine only READS what the panel prepares ...
              mountPath: /data
              readOnly: true
            - name: data                       # ... and writes only its own status files and logs
              mountPath: /data/rendered
              subPath: rendered
            - name: data
              mountPath: /data/logs
              subPath: logs
            - name: tmp-engine
              mountPath: /tmp
            {{- if .Values.certs.secrets }}
            - name: certs
              mountPath: /certs
              readOnly: true
            {{- end }}
        - name: panel
          image: {{ include "shieldwaf.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 9000
          env:
            - name: SHIELD_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: SHIELD_DB_URL
            - name: SHIELD_DB_SSLMODE
              value: {{ .Values.database.sslMode | quote }}
            - name: SHIELD_DATA_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: SHIELD_DATA_KEY
            - name: SHIELD_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.redis.secretName }}
                  key: SHIELD_REDIS_URL
                  optional: true
            - name: SHIELD_PRIVATE
              value: /private
            - name: SHIELD_NODE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9000
              scheme: HTTPS
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9000
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.resources.panel | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: private                    # panel-only secrets: NOT mounted in the engine container
              mountPath: /private
            - name: tmp-panel
              mountPath: /tmp
            {{- if .Values.certs.secrets }}
            - name: certs
              mountPath: /certs
              readOnly: true
            {{- end }}
            {{- if .Values.panelTls.secretName }}
            - name: panel-tls
              mountPath: /panel-tls
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.dataVolumeSizeLimit }}
        - name: private
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp-engine
          emptyDir:
            sizeLimit: 256Mi
        - name: tmp-panel
          emptyDir:
            sizeLimit: 256Mi
        {{- if .Values.certs.secrets }}
        - name: certs
          projected:
            sources:
              {{- range .Values.certs.secrets }}
              - secret:
                  name: {{ .secretName }}
                  items:
                    - {key: tls.crt, path: "{{ .name }}/tls.crt"}
                    - {key: tls.key, path: "{{ .name }}/tls.key"}
              {{- end }}
        {{- end }}
        {{- if .Values.panelTls.secretName }}
        - name: panel-tls
          secret:
            secretName: {{ .Values.panelTls.secretName }}
        {{- end }}
