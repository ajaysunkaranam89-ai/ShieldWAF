{{- if .Values.pdb.enabled }}
# At least one replica stays up during voluntary disruptions (node drain, cluster upgrades).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shieldwaf
  labels: {{- include "shieldwaf.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels:
      app: shieldwaf
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shieldwaf
  labels: {{- include "shieldwaf.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ .Values.deployment.name }}
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300      # do not drop replicas quickly after a traffic peak
{{- end }}
