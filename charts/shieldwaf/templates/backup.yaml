{{- if .Values.backup.enabled }}
# Encrypted nightly backups of the database. Restore with scripts/restore-db.sh (see docs/INSTALL.md): DEPLOY={{ .Values.deployment.name }} DB_HOST={{ include "shieldwaf.dbHost" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shieldwaf-backups
  labels: {{- include "shieldwaf.labels" . | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.backup.storageClassName }}
  storageClassName: {{ .Values.backup.storageClassName }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backup.storage }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: shieldwaf-db-backup
  labels: {{- include "shieldwaf.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: shieldwaf-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets: {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: {{ include "shieldwaf.dbImage" . | quote }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: PGPASSWORD
                  valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: POSTGRES_PASSWORD}}
                - name: SHIELD_DATA_KEY
                  valueFrom: {secretKeyRef: {name: {{ .Values.secret.name }}, key: SHIELD_DATA_KEY}}
                - name: KEEP_DAYS
                  value: {{ .Values.backup.keepDays | quote }}
                - name: PGHOST
                  value: {{ include "shieldwaf.dbHost" . | quote }}
                - name: PGUSER
                  value: shieldwaf
                - name: PGDATABASE
                  value: shieldwaf
              command:
                - sh
                - -c
                - |
                  set -eu
                  umask 077
                  f="/backups/shieldwaf-$(date -u +%Y%m%d-%H%M%S).dump.enc"
                  pg_dump -Fc \
                    | openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SHIELD_DATA_KEY -out "$f.part"
                  openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:SHIELD_DATA_KEY -in "$f.part" | pg_restore -l > /dev/null
                  mv "$f.part" "$f"
                  echo "backup written and verified: $f ($(wc -c < "$f") bytes, starts with $(head -c 8 "$f" | od -An -c | tr -s ' '))"
                  find /backups -name 'shieldwaf-*.dump.enc' -mtime +"$KEEP_DAYS" -delete
                  find /backups -name '*.part' -mmin +120 -delete
                  echo "backups on the volume:"; ls -1 /backups | grep '^shieldwaf-' | tail -n 20
              resources:
                requests: {cpu: 20m, memory: 64Mi}
                limits: {cpu: "1", memory: 256Mi}
              volumeMounts:
                - {name: backups, mountPath: /backups}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: backups
              persistentVolumeClaim: {claimName: shieldwaf-backups}
            - name: tmp
              emptyDir: {sizeLimit: 64Mi}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shieldwaf-backup-allow
  labels: {{- include "shieldwaf.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: shieldwaf-backup
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              app: shieldwaf-db
      ports:
        - {protocol: TCP, port: 5432}
{{- end }}
{{- end }}
