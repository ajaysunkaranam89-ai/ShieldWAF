# One service account per component, none with permissions or a token: a compromised pod cannot talk to the Kubernetes API.
{{- range $n := list "shieldwaf-app" "shieldwaf-db" "shieldwaf-backup" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $n }}
  labels: {{- include "shieldwaf.labels" $ | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
