# A Shield WAF database access rules (used when TLS is on, see tls-entrypoint.sh).
# Network connections MUST use TLS and a SCRAM-SHA-256 password; plain connections are rejected. Replication is not allowed.
local   all   all                       trust
hostssl all   all   0.0.0.0/0           scram-sha-256
hostssl all   all   ::/0                scram-sha-256
host    all   all   all                 reject
