# Same as pg_hba.conf, plus replication connections (streaming standby, pg_basebackup) over TLS with a SCRAM password. Used when SHIELD_DB_REPLICATION=on.
local       all   all                       trust
hostssl     all   all   0.0.0.0/0           scram-sha-256
hostssl     all   all   ::/0                scram-sha-256
hostssl     replication all 0.0.0.0/0       scram-sha-256
hostssl     replication all ::/0            scram-sha-256
host        all   all   all                 reject
