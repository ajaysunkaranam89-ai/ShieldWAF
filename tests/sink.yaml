apiVersion: v1
kind: Namespace
metadata:
  name: sink-test
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sink-script
  namespace: sink-test
data:
  sink.py: |
    # Test sink: receives syslog (UDP 5514, TCP 5515), HTTP (8000) and SMTP (2525) and prints every message to stdout.
    import socket, socketserver, threading, sys
    from http.server import BaseHTTPRequestHandler, HTTPServer

    def log(kind, text):
        print("SINK", kind, text.replace("\n", " ")[:900], flush=True)

    def udp():
        s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.bind(("0.0.0.0", 5514))
        while True:
            data, _ = s.recvfrom(65535); log("syslog-udp", data.decode("utf-8", "replace"))

    class TcpH(socketserver.StreamRequestHandler):
        def handle(self):
            for line in self.rfile:
                log("syslog-tcp", line.decode("utf-8", "replace").strip())

    class HttpH(BaseHTTPRequestHandler):
        def do_POST(self):
            n = int(self.headers.get("Content-Length", 0) or 0)
            body = self.rfile.read(n).decode("utf-8", "replace")
            log("http " + self.path + " auth=" + str(self.headers.get("Authorization", "")[:12]), body)
            self.send_response(200); self.end_headers(); self.wfile.write(b"ok")
        def log_message(self, *a): pass

    class SmtpH(socketserver.StreamRequestHandler):
        def handle(self):
            w = lambda s: (self.wfile.write((s + "\r\n").encode()), self.wfile.flush())
            w("220 sink ESMTP")
            data_mode, buf = False, []
            for raw in self.rfile:
                line = raw.decode("utf-8", "replace").rstrip("\r\n")
                if data_mode:
                    if line == ".":
                        log("smtp", " | ".join(buf)); data_mode = False; w("250 queued")
                    else:
                        buf.append(line)
                    continue
                u = line.upper()
                if u.startswith(("EHLO", "HELO")): w("250-sink"); w("250 OK")
                elif u.startswith("DATA"): data_mode, buf = True, []; w("354 go")
                elif u.startswith("QUIT"): w("221 bye"); return
                else: w("250 OK")

    class Srv(socketserver.ThreadingMixIn, socketserver.TCPServer):
        allow_reuse_address = True; daemon_threads = True

    threading.Thread(target=udp, daemon=True).start()
    threading.Thread(target=lambda: Srv(("0.0.0.0", 5515), TcpH).serve_forever(), daemon=True).start()
    threading.Thread(target=lambda: Srv(("0.0.0.0", 2525), SmtpH).serve_forever(), daemon=True).start()
    HTTPServer(("0.0.0.0", 8000), HttpH).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sink
  namespace: sink-test
spec:
  replicas: 1
  selector:
    matchLabels: {app: sink}
  template:
    metadata:
      labels: {app: sink}
    spec:
      containers:
        - name: sink
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command: ["python3", "-u", "/s/sink.py"]
          volumeMounts: [{name: s, mountPath: /s}]
      volumes:
        - name: s
          configMap: {name: sink-script}
---
apiVersion: v1
kind: Service
metadata:
  name: sink
  namespace: sink-test
spec:
  selector: {app: sink}
  ports:
    - {name: udp, port: 5514, protocol: UDP}
    - {name: tcp, port: 5515, protocol: TCP}
    - {name: http, port: 8000, protocol: TCP}
    - {name: smtp, port: 2525, protocol: TCP}
