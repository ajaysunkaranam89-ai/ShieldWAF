# Two tiny stand-in applications for the regression test (names and addresses match what functional_test.py expects):
# They live in their own namespace "shieldwaf-demo" with unique names, so the test can never touch your real applications:
#   http://demo-notes.shieldwaf-demo.svc.cluster.local:80    GET /health, GET/POST /api/notes
#   http://demo-python.shieldwaf-demo.svc.cluster.local:80   GET /
apiVersion: v1
kind: Namespace
metadata: {name: shieldwaf-demo}
---
apiVersion: v1
kind: ConfigMap
metadata: {name: demo-app, namespace: shieldwaf-demo}
data:
  app.py: |
    import json, os
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    class H(BaseHTTPRequestHandler):
        def _send(self, code, body, ctype="application/json"):
            b = body.encode()
            self.send_response(code); self.send_header("Content-Type", ctype); self.send_header("X-Demo-App", os.environ.get("APP_NAME", "?")); self.send_header("Content-Length", str(len(b))); self.end_headers(); self.wfile.write(b)
        def do_GET(self):
            p = self.path.split("?")[0]
            if p == "/health": return self._send(200, json.dumps({"status": "ok", "db": "up"}))
            if p == "/": return self._send(200, "<html><body><h1>demo application</h1></body></html>", "text/html")
            if p == "/api/notes": return self._send(200, "[]")
            self._send(404, '{"error":"not found"}')
        def do_POST(self):
            self.rfile.read(int(self.headers.get("Content-Length", 0) or 0))
            if self.path.split("?")[0] == "/api/notes": return self._send(201, '{"id":1}')
            self._send(404, '{"error":"not found"}')
        def _no(self): self._send(405, "{}")
        do_PUT = do_DELETE = do_PATCH = _no
        def log_message(self, *a): pass

    ThreadingHTTPServer(("0.0.0.0", 8000), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo-notes, namespace: shieldwaf-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: demo-notes}}
  template:
    metadata: {labels: {app: demo-notes}}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python3", "-u", "/a/app.py"]
          env: [{name: APP_NAME, value: demo-notes}]
          ports: [{containerPort: 8000}]
          volumeMounts: [{name: a, mountPath: /a}]
      volumes: [{name: a, configMap: {name: demo-app}}]
---
apiVersion: v1
kind: Service
metadata: {name: demo-notes, namespace: shieldwaf-demo}
spec:
  selector: {app: demo-notes}
  ports: [{port: 80, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: demo-python, namespace: shieldwaf-demo}
spec:
  replicas: 1
  selector: {matchLabels: {app: demo-python}}
  template:
    metadata: {labels: {app: demo-python}}
    spec:
      containers:
        - name: app
          image: python:3.12-alpine
          command: ["python3", "-u", "/a/app.py"]
          env: [{name: APP_NAME, value: demo-python}]
          ports: [{containerPort: 8000}]
          volumeMounts: [{name: a, mountPath: /a}]
      volumes: [{name: a, configMap: {name: demo-app}}]
---
apiVersion: v1
kind: Service
metadata: {name: demo-python, namespace: shieldwaf-demo}
spec:
  selector: {app: demo-python}
  ports: [{port: 80, targetPort: 8000}]
