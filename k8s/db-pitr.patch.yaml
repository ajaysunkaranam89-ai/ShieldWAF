# Strategic-merge patch for the StatefulSet shieldwaf-db (see k8s/db-pitr.yaml): archive every finished WAL segment to the volume shieldwaf-wal-archive and allow the
# replication connection that pg_basebackup uses (TLS + password, from inside the namespace only).
spec:
  template:
    spec:
      containers:
        - name: postgres
          env:
            - {name: SHIELD_DB_ARCHIVE_DIR, value: /archive}
            - {name: SHIELD_DB_REPLICATION, value: "on"}
          volumeMounts:
            - {name: wal-archive, mountPath: /archive}
      volumes:
        - name: wal-archive
          persistentVolumeClaim: {claimName: shieldwaf-wal-archive}
