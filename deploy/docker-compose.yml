# A Shield WAF 2.4 with Docker Compose: PostgreSQL (TLS), the panel (HTTPS GUI) and the engine (nginx + ModSecurity + OWASP CRS). One host, one replica of each;
# for several replicas and rolling updates use Kubernetes (docs/KUBERNETES_DEPLOYMENT.md).
#   sh deploy/docker-init.sh                 creates deploy/.env with random secrets (once)
#   docker compose -f deploy/docker-compose.yml --env-file deploy/.env up -d
#   open https://127.0.0.1:9000 (self-signed certificate) and create the admin account; the setup code is in:  docker compose -f deploy/docker-compose.yml logs panel | grep "Setup code"
# Protected traffic arrives on the ports 8080 (http) and 8443 (https) of this host (change them with HTTP_PORT / HTTPS_PORT / PANEL_PORT in deploy/.env); add your sites in the panel.
# The engine runs in the network namespace of the panel (like the two containers of a Kubernetes pod), shares only the folders it needs, and cannot see the panel-only
# secrets: /private is a memory volume mounted in the panel container only. Images: docker build -t shieldwaf:2.4 . ; docker build -t shieldwaf-db:2.4 db
name: shieldwaf
services:
  db:
    image: shieldwaf-db:2.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: shieldwaf
      POSTGRES_DB: shieldwaf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run deploy/docker-init.sh first}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
    tmpfs:
      - /tmp:exec,mode=1777
      - /var/run/postgresql:uid=70,gid=70,mode=0775
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shieldwaf", "-d", "shieldwaf"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  panel:
    image: shieldwaf:2.4
    restart: unless-stopped
    user: "10101:10101"
    depends_on:
      db: {condition: service_healthy}
    environment:
      SHIELD_DB_URL: postgresql://shieldwaf:${POSTGRES_PASSWORD}@db:5432/shieldwaf
      SHIELD_DB_SSLMODE: require
      SHIELD_DATA_KEY: ${SHIELD_DATA_KEY:?run deploy/docker-init.sh first}
      SHIELD_PRIVATE: /private
      SHIELD_NODE: docker-1
    volumes:
      - data:/data
      - rendered:/data/rendered
      - logs:/data/logs
    tmpfs:
      - /private:uid=10101,gid=10101,mode=0700,size=16m
      - /tmp:uid=10101,gid=10101,mode=1777,size=256m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    ports:
      - "127.0.0.1:${PANEL_PORT:-9000}:9000"          # the admin panel: only on this host (put it behind a VPN or an SSH tunnel; never on the internet)
      - "${HTTP_PORT:-8080}:8080"      # protected traffic (the engine shares this network namespace)
      - "${HTTPS_PORT:-8443}:8443"
    networks: [internal]

  engine:
    image: shieldwaf:2.4
    restart: unless-stopped
    user: "10101:10101"
    command: ["/usr/local/bin/engine-entrypoint.sh"]
    network_mode: "service:panel"
    depends_on:
      panel: {condition: service_started}
    volumes:
      - data:/data:ro                  # rules, certificates and feeds: read-only for the engine
      - rendered:/data/rendered        # the generated configuration and the engine's status files
      - logs:/data/logs
    tmpfs:
      - /tmp:uid=10101,gid=10101,mode=1777,size=256m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  internal: {}
volumes:
  pgdata: {}
  data: {}
  rendered: {}
  logs: {}
